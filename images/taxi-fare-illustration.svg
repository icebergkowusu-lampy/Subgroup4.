<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="txTitle txDesc">
  <title id="txTitle">Taxi fare real-life context</title>
  <desc id="txDesc">A simple illustration of a taxi on a road with a distance marker, representing the real-life taxi fare scenario C equals 5x plus 10.</desc>
  <rect width="600" height="360" fill="#312B5E"/>
  <rect x="0" y="260" width="600" height="100" fill="#221E45"/>
  <rect x="0" y="270" width="600" height="10" fill="#F5D48A"/>
  <g fill="#F5D48A">
    <rect x="40" y="272" width="30" height="6"/><rect x="110" y="272" width="30" height="6"/>
    <rect x="180" y="272" width="30" height="6"/><rect x="250" y="272" width="30" height="6"/>
    <rect x="320" y="272" width="30" height="6"/><rect x="390" y="272" width="30" height="6"/>
    <rect x="460" y="272" width="30" height="6"/><rect x="530" y="272" width="30" height="6"/>
  </g>
  <circle cx="120" cy="90" r="34" fill="#FDF3D8" opacity="0.9"/>
  <g fill="#06B6D4" opacity="0.5">
    <circle cx="470" cy="70" r="4"/><circle cx="500" cy="120" r="3"/><circle cx="430" cy="130" r="3"/>
    <circle cx="60" cy="180" r="3"/><circle cx="530" cy="170" r="4"/>
  </g>
  <g>
    <rect x="220" y="190" width="160" height="55" rx="14" fill="#F59E0B"/>
    <rect x="240" y="165" width="100" height="40" rx="12" fill="#F59E0B"/>
    <rect x="255" y="172" width="30" height="20" rx="4" fill="#EDEEFA" opacity="0.85"/>
    <rect x="295" y="172" width="30" height="20" rx="4" fill="#EDEEFA" opacity="0.85"/>
    <circle cx="250" cy="248" r="16" fill="#171233"/><circle cx="250" cy="248" r="6" fill="#8B87C7"/>
    <circle cx="350" cy="248" r="16" fill="#171233"/><circle cx="350" cy="248" r="6" fill="#8B87C7"/>
    <rect x="230" y="200" width="20" height="8" fill="#EEEFFB"/>
    <rect x="290" y="180" width="30" height="8" fill="#171233"/>
  </g>
  <text x="80" y="330" font-family="IBM Plex Mono, monospace" font-size="20" fill="#EDEEFB">0 km</text>
  <text x="520" y="330" font-family="IBM Plex Mono, monospace" font-size="20" fill="#EDEEFB">x km</text>
  <text x="150" y="40" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="700" fill="#fff">C = 5x + 10</text>
</svg>
