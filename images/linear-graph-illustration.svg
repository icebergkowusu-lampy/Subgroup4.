<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="lgTitle lgDesc">
  <title id="lgTitle">Graph of a linear function</title>
  <desc id="lgDesc">A straight line sloping upward from left to right on a coordinate grid, illustrating the graph of a linear function y equals m x plus c.</desc>
  <rect width="600" height="360" fill="#ECEEFA"/>
  <g stroke="#C9CCEE" stroke-width="1">
    <line x1="0" y1="30" x2="600" y2="30"/><line x1="0" y1="70" x2="600" y2="70"/>
    <line x1="0" y1="110" x2="600" y2="110"/><line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="190" x2="600" y2="190"/><line x1="0" y1="230" x2="600" y2="230"/>
    <line x1="0" y1="270" x2="600" y2="270"/><line x1="0" y1="310" x2="600" y2="310"/>
    <line x1="30" y1="0" x2="30" y2="360"/><line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="130" y1="0" x2="130" y2="360"/><line x1="180" y1="0" x2="180" y2="360"/>
    <line x1="230" y1="0" x2="230" y2="360"/><line x1="280" y1="0" x2="280" y2="360"/>
    <line x1="330" y1="0" x2="330" y2="360"/><line x1="380" y1="0" x2="380" y2="360"/>
    <line x1="430" y1="0" x2="430" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="530" y1="0" x2="530" y2="360"/><line x1="580" y1="0" x2="580" y2="360"/>
  </g>
  <line x1="0" y1="230" x2="600" y2="230" stroke="#4B4762" stroke-width="2"/>
  <line x1="60" y1="0" x2="60" y2="360" stroke="#4B4762" stroke-width="2"/>
  <line x1="80" y1="330" x2="560" y2="50" stroke="#4F46E5" stroke-width="5" stroke-linecap="round"/>
  <circle cx="80" cy="330" r="7" fill="#06B6D4"/>
  <circle cx="320" cy="190" r="7" fill="#06B6D4"/>
  <circle cx="560" cy="50" r="7" fill="#06B6D4"/>
  <text x="330" y="40" font-family="Space Grotesk, sans-serif" font-size="26" fill="#312B5E" font-weight="700">y = mx + c</text>
  <text x="500" y="220" font-family="IBM Plex Mono, monospace" font-size="16" fill="#4B4762">x</text>
  <text x="70" y="30" font-family="IBM Plex Mono, monospace" font-size="16" fill="#4B4762">y</text>
</svg>
